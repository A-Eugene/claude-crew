# Replace crew.example.com with your host name. Get the certificate with
# `certbot certonly`, so certbot does not rewrite some other server block.
server {
  listen 80;
  listen [::]:80;
  server_name crew.example.com;
  return 301 https://$host$request_uri;
}

server {
  listen 443 ssl http2;
  listen [::]:443 ssl http2;
  server_name crew.example.com;

  ssl_certificate /etc/letsencrypt/live/crew.example.com/fullchain.pem;
  ssl_certificate_key /etc/letsencrypt/live/crew.example.com/privkey.pem;
  include /etc/letsencrypt/options-ssl-nginx.conf;
  ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

  location / {
    proxy_pass http://127.0.0.1:3115;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_read_timeout 700s;
    client_max_body_size 16k;
  }
}
